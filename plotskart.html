<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plotskart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: left rail (desktop) / bottom tab bar (phone) + work area; each project's plot map is the hero */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#E2E8E5; --ink:#14212A; --muted:#566870; --line:#D2DBD7;
  --accent:#24477F; --accent-ink:#FFFFFF; --accent-soft:#DDE6F5;
  --sold:#3FAE63; --booked:#F1C33F; --avail:#E2574C; --plot-ink:#0D1A13;
  --good:#2F8F52; --warn:#B7791F; --bad:#C2413A;
  --land:#E3EBDC; --road:#A7B0B3; --road-ink:#FFFFFF; --park:#BCD8AF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1416; --surface:#162024; --sunk:#1C282C; --ink:#E3EBE9; --muted:#97A7AA; --line:#2A383C;
  --accent:#93B1EC; --accent-ink:#0E1416; --accent-soft:#22314C;
  --good:#5CC284; --warn:#E0A84A; --bad:#EE7A70;
  --land:#18241E; --road:#3A474B; --road-ink:#C9D3D5; --park:#22402B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1416; --surface:#162024; --sunk:#1C282C; --ink:#E3EBE9; --muted:#97A7AA; --line:#2A383C;
  --accent:#93B1EC; --accent-ink:#0E1416; --accent-soft:#22314C;
  --good:#5CC284; --warn:#E0A84A; --bad:#EE7A70;
  --land:#18241E; --road:#3A474B; --road-ink:#C9D3D5; --park:#22402B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-block:20px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.72rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem;color:var(--muted)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.main{min-width:0;padding-bottom:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.top .ttl{flex:1;min-width:0}
.top .ttl h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.role select{border:0;background:transparent;font-weight:600;padding:4px 2px;max-width:150px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.bell svg{width:18px;height:18px}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--avail);color:#fff;font-size:.68rem;font-weight:600;display:grid;place-items:center;padding:0 4px}
.mbrand{display:none}

.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .mbrand{display:block}
  .main{padding-bottom:96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;padding:6px 0;color:var(--muted);border-radius:8px}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .tabbar button:focus-visible{outline:2px solid var(--accent)}
  h1{font-size:1.4rem}
  .role{padding-left:8px}
  .role .lbl{display:none}
  .top .ttl h2{font-size:1rem}
}

.stack-v{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
@media (max-width:420px){.grid2{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.78rem}
.kpi .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.sw.s-sold,.bar .s-sold{background:var(--sold)} .sw.s-booked,.bar .s-booked{background:var(--booked)} .sw.s-available,.bar .s-available{background:var(--avail)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
@media (max-width:420px){.plist{grid-template-columns:minmax(0,1fr)}}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard:hover{border-color:var(--accent)}
.pcard:focus-visible{outline:2px solid var(--accent)}
.pcard .loc{color:var(--muted);font-size:.82rem}
.cnts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cnts div{display:flex;flex-direction:column}
.cnts b{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.cnts span{font-size:.74rem;color:var(--muted)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.money b{font-family:var(--f-mono);font-weight:500;font-size:.92rem}
.money span{font-size:.72rem;color:var(--muted);display:block}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--plot-ink)}
.pill.st-sold{background:var(--sold)} .pill.st-booked{background:var(--booked)} .pill.st-available{background:var(--avail)}
.tag{display:inline-block;font-size:.72rem;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.urgent{background:var(--avail);color:var(--plot-ink)}
.tag.soon{background:var(--booked);color:var(--plot-ink)}
.tag.ok{background:var(--accent-soft);color:var(--ink)}

.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:7px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:4px}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:.85rem;margin-bottom:6px;display:inline-block}

.maptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:500;font-size:.85rem}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip .n{font-family:var(--f-mono);color:var(--muted)}
.tools-r{display:flex;gap:6px;align-items:center}
.tools-r input{width:120px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.zoom{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zoom button{all:unset;cursor:pointer;width:34px;height:32px;display:grid;place-items:center;font-weight:600}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--land);max-height:72vh;-webkit-overflow-scrolling:touch}
svg.map{display:block;min-width:100%;height:auto}
.m-land{fill:var(--land)}
.m-road{fill:var(--road)}
.m-roadl{stroke:var(--road);fill:none}
.m-park{fill:var(--park);stroke:var(--surface);stroke-width:2}
.m-park-t{fill:var(--ink);font-family:var(--f-mono);font-size:10px;text-anchor:middle;opacity:.75}
.m-dp{fill:var(--ink)} .m-dp-t{fill:var(--bg);font-family:var(--f-mono);font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.m-lbl{fill:var(--road-ink);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-anchor:middle;dominant-baseline:central}
.m-plot{cursor:pointer}
.m-plot .sh{stroke:var(--surface);stroke-width:2.5;transition:opacity .15s}
.m-plot.st-sold .sh{fill:var(--sold)} .m-plot.st-booked .sh{fill:var(--booked)} .m-plot.st-available .sh{fill:var(--avail)}
.m-plot text{fill:var(--plot-ink);font-family:var(--f-mono);font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.m-plot:hover .sh{stroke:var(--ink);stroke-width:3}
.m-plot.dim{opacity:.16}
.m-plot.sel .sh,.m-plot.hit .sh{stroke:var(--ink);stroke-width:5}
.m-plot:focus{outline:none}
.m-plot:focus-visible .sh{stroke:var(--accent);stroke-width:5}
.m-comp circle{fill:var(--surface);stroke:var(--line)} .m-comp path{fill:var(--avail)} .m-comp text{fill:var(--ink);font-family:var(--f-mono);font-size:11px;font-weight:600;text-anchor:middle}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
.minibar{width:90px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.15}
.tile small{color:var(--muted);font-size:.78rem}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .lbl,.tile.hero small{color:inherit;opacity:.8}
.pos{color:var(--good)} .neg{color:var(--bad)}

.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dl div{background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;min-width:0}
.dl b{font-family:var(--f-mono);font-weight:500;font-size:.92rem;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}

.vastu{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start}
.vrow i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.vrow i.good{background:var(--good)} .vrow i.ok{background:var(--warn)} .vrow i.warn{background:var(--bad)}
.vrow small{display:block;color:var(--muted)}
.stars{font-family:var(--f-mono);color:var(--warn);letter-spacing:2px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .body p{overflow-wrap:anywhere}
.li .meta{font-size:.76rem;color:var(--muted)}
.li .ic{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--plot-ink)}
.ic.k-sold{background:var(--sold)} .ic.k-booked{background:var(--booked)} .ic.k-available{background:var(--avail)} .ic.k-reg{background:var(--accent);color:var(--accent-ink)} .ic.k-pay{background:var(--booked)} .ic.k-money{background:var(--sunk);color:var(--ink)} .ic.k-rate{background:var(--accent-soft);color:var(--ink)}
.li.unread .body p{font-weight:600}
.udot{width:8px;height:8px;border-radius:50%;background:var(--avail);flex:none;margin-top:8px}

.rem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rem .when{align-self:start;width:58px;text-align:center;border-radius:10px;padding:8px 0;background:var(--sunk)}
.rem .when b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1}
.rem .when small{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rem .when.urgent{background:var(--avail);color:var(--plot-ink)} .rem .when.urgent small{color:inherit}
.rem .when.soon{background:var(--booked);color:var(--plot-ink)} .rem .when.soon small{color:inherit}
.rem .msg{font-size:.82rem;background:var(--sunk);border-radius:8px;padding:8px 10px;margin-top:8px;overflow-wrap:anywhere}
.rem-list{display:flex;flex-direction:column;gap:12px}
.setrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.setrow label{display:flex;align-items:center;gap:8px}
.setrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}

form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--sunk);border-radius:10px;padding:14px}
form.f .wide{grid-column:1/-1}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
form.f input,form.f select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.92rem;color:var(--ink);min-width:0;width:100%}
form.f h3{grid-column:1/-1}
@media (max-width:420px){form.f{grid-template-columns:minmax(0,1fr)}}

.scrim{position:fixed;inset:0;background:rgba(8,14,16,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:21;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){.sheet{top:auto;left:0;width:100%;max-height:88%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.sheet>*{flex-shrink:0}
.sh-h{display:flex;align-items:flex-start;gap:12px}
.sh-h .t{flex:1;min-width:0}
.sh-h h2{font-size:1.6rem}
.x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:1.1rem}
.x:focus-visible{outline:2px solid var(--accent)}
.sec{display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.demo{font-size:.78rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div class="scrim" id="scrim" data-act="close" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const NOW=new Date();NOW.setHours(0,0,0,0);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=ymd(NOW);
const dayOff=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return ymd(d)};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-NOW)/864e5);
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';

function layoutGrid(cfg){
  const plots=[];
  cfg.blocks.forEach(b=>{let n=1;for(let c=0;c<2;c++)for(let r=0;r<b.rows;r++){
    const p={label:b.p+(n++),x:b.x+c*cfg.pw,y:b.y+r*cfg.ph,w:cfg.pw,h:cfg.ph,facing:c?'E':'W'};
    if(b.top&&r===b.rows-1&&b.rows===cfg.rows)p.corner='S';
    if(!b.top&&r===0)p.corner='N';
    plots.push(p)}});
  return {w:cfg.w,h:cfg.h,scale:cfg.scale,plots,roads:cfg.roads,diag:[],parks:cfg.parks,labels:cfg.labels,compass:cfg.compass};
}

function polyArea(pts){const a=pts.split(' ').map(s=>s.split(',').map(Number));let s=0;for(let i=0;i<a.length;i++){const[x1,y1]=a[i],[x2,y2]=a[(i+1)%a.length];s+=x1*y2-x2*y1}return Math.abs(s)/2}

function vastu(p){
  const f=p.facing,main=f[0];let score={E:5,N:5,W:3.5,S:2.5}[main];const notes=[];
  notes.push([`${DIR[main]}-facing entrance`,{E:'Most preferred. Morning sun reaches the entrance.',N:'Highly preferred. Associated with prosperity.',W:'Acceptable. Keep the gate in the north-west half of the frontage.',S:'Needs care. Keep the gate in the south-east half of the frontage.'}[main],{E:'good',N:'good',W:'ok',S:'warn'}[main]]);
  if(f.length>1){const s=new Set(f);let c;
    if(s.has('N')&&s.has('E')){c=['North-east corner plot','Ishanya corner, considered the most auspicious.','good'];score+=.5}
    else if(s.has('S')&&s.has('W'))c=['South-west corner plot','Nairutya corner. Suits the master bedroom; keep this corner built-up.','ok'];
    else if(s.has('S')&&s.has('E')){c=['South-east corner plot','Agneya corner. Good position for the kitchen.','ok'];score-=.3}
    else c=['North-west corner plot','Vayavya corner. Average; suits guest rooms and storage.','ok'];
    notes.push(c)}
  else notes.push(['Road on one side','Single frontage, no corner influence.','ok']);
  const r=Math.max(p.front,p.depth)/Math.min(p.front,p.depth);
  if(p.pts){notes.push(['Irregular shape','One side runs along the diagonal DP road. Rated lower in vastu.','warn']);score-=.8}
  else notes.push([r<=1.1?'Square plot':r<=1.8?'Rectangular plot':'Elongated plot',`Side ratio 1 : ${r.toFixed(2)}${r<=1.8?', within the preferred range.':'. Long, narrow plots are rated lower.'}`,r<=1.8?'good':'warn']);
  if(r>1.8)score-=.7;
  score=Math.max(1,Math.min(5,Math.round(score*2)/2));
  return {score,notes};
}

function findPlot(id){for(const pr of S.projects){const p=pr.plots.find(x=>x.id===id);if(p)return[pr,p]}return[]}
const val=(pr,p)=>p.sqft*(p.rate||pr.rate);
const bal=(pr,p)=>p.status==='available'?0:Math.max(0,val(pr,p)-p.paid);
function counts(plots){const c={sold:0,booked:0,available:0,total:plots.length};plots.forEach(p=>c[p.status]++);return c}
function commOf(uid,pid){
  const u=U(uid);let earned=0,sold=0,booked=0,value=0;const plots=[];
  S.projects.forEach(pr=>{if(pid&&pr.id!==pid)return;pr.plots.forEach(p=>{if(p.soldBy!==uid||p.status==='available')return;plots.push([pr,p]);
    if(p.status==='sold'){sold++;value+=val(pr,p);earned+=val(pr,p)*(u.rate||0)/100}else booked++})});
  const paid=S.commPaid.filter(c=>c.uid===uid&&(!pid||c.pid===pid)).reduce((a,c)=>a+c.amount,0);
  return {earned,paid,pending:Math.max(0,earned-paid),sold,booked,value,plots};
}
function fin(pr){
  let R=0,contract=0,collected=0,pendingCust=0,unsold=0;
  pr.plots.forEach(p=>{const v=val(pr,p);R+=v;if(p.status==='available')unsold+=v;else{contract+=v;collected+=p.paid;pendingCust+=Math.max(0,v-p.paid)}});
  const committed=pr.costs.reduce((a,c)=>a+c.committed,0),paid=pr.costs.reduce((a,c)=>a+c.paid,0);
  let cE=0,cP=0;S.users.forEach(u=>{if(u.role==='owner')return;const c=commOf(u.id,pr.id);cE+=c.earned;cP+=c.paid});
  const cost=committed+cE,out=paid+cP,toPay=(committed-paid)+Math.max(0,cE-cP);
  const invested=pr.funding.bank+pr.funding.credit+pr.funding.cash;
  return {R,contract,collected,pendingCust,unsold,committed,paid,cE,cP,cost,out,toPay,profit:R-cost,margin:(R-cost)/R,invested,net:collected-out};
}
function reminders(){
  const out=[];
  S.projects.forEach(pr=>pr.plots.forEach(p=>{
    if(p.status==='available')return;
    if(p.regDate&&!p.registered){const d=daysTo(p.regDate);if(d>=-7&&d<=14)out.push({key:`reg:${p.id}:${p.regDate}`,type:'reg',d,pr,p})}
    if(bal(pr,p)>0&&p.dueDate){const d=daysTo(p.dueDate);if(d<=14)out.push({key:`pay:${p.id}:${p.dueDate}:${TODAY}`,type:'pay',d,pr,p})}
  }));
  const m=me();
  return out.filter(r=>m.role!=='broker'||r.p.soldBy===m.id).sort((a,b)=>a.d-b.d);
}
const due=r=>r.type==='reg'?r.d<=S.settings.regDays:r.d<=S.settings.payDays;
const myNotes=()=>S.notes.filter(n=>n.to.includes(UI.user));
const unread=()=>myNotes().filter(n=>!n.read.includes(UI.user)).length;

/* ---------- mutations ---------- */
function notify(text,kind,to){
  to=to||S.users.map(u=>u.id).filter(id=>id!==UI.user);
  S.notes.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),ts:Date.now(),text,actor:UI.user,to,read:[],kind});
}
function custMsg(pr,p,kind,text){S.outbox.unshift({ts:Date.now(),to:p.buyer,phone:p.phone,channel:'WhatsApp + SMS',plot:p.label,project:pr.name,kind,text})}
function log(p,t){p.history.unshift([TODAY,t,UI.user])}
function remText(r){
  const {pr,p}=r,b=bal(pr,p);
  if(r.type==='reg')return{team:`Registration ${whenTxt(r.d)}: ${p.label} · ${pr.name} for ${p.buyer} on ${fmtD(p.regDate)}. Prepare sale deed draft, stamp duty challan and ID copies.${b>0?' Balance '+inr(b)+' still to collect.':''}`,
    cust:`Dear ${p.buyer}, registration of plot ${p.label} at ${pr.name} is scheduled on ${fmtD(p.regDate)} at the Sub-Registrar office. Please bring Aadhaar, PAN, 2 passport photos${b>0?' and the balance of '+inr(b):''}. – ${S.company}`};
  return{team:`Payment ${r.d<0?'overdue by '+(-r.d)+' day'+(r.d===-1?'':'s'):'due '+whenTxt(r.d)}: ${p.buyer} owes ${inr(b)} on ${p.label} · ${pr.name}.`,
    cust:`Dear ${p.buyer}, a reminder that the balance of ${inr(b)} for plot ${p.label} at ${pr.name} ${r.d<0?'was due on':'is due on'} ${fmtD(p.dueDate)}. Please contact us to complete the payment. – ${S.company}`};
}
function dispatch(r,actor){
  const t=remText(r),to=S.users.filter(u=>u.role==='owner'||u.role==='sales'||u.id===r.p.soldBy).map(u=>u.id);
  S.notes.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),ts:Date.now(),text:t.team,actor:actor||'system',to:actor?to.filter(x=>x!==actor):to,read:[],kind:r.type});
  custMsg(r.pr,r.p,r.type,t.cust);
  S.sent[r.key]=TODAY;
}
function autoDispatch(){
  // runs the same check a scheduled server job would run each morning
  const saveUser=UI.user;UI.user='own';const list=reminders();UI.user=saveUser;
  let n=0;list.forEach(r=>{if(r.d>=-7&&due(r)&&!S.sent[r.key]){dispatch(r);n++}});
  if(n)save();return n;
}

function stackBar(c){return `<div class="bar" role="img" aria-label="${c.sold} sold, ${c.booked} booked, ${c.available} available"><i class="s-sold" style="width:${c.sold/c.total*100}%"></i><i class="s-booked" style="width:${c.booked/c.total*100}%"></i><i class="s-available" style="width:${c.available/c.total*100}%"></i></div>`}
function pcard(pr){

function mapSVG(pr){
  const L=pr.layout;let h=`<svg class="map" id="map" viewBox="0 0 ${L.w} ${L.h}" style="width:${UI.zoom*100}%" role="img" aria-label="Plot layout of ${esc(pr.name)}"><rect class="m-land" x="0" y="0" width="${L.w}" height="${L.h}"/>`;
  L.roads.forEach(r=>h+=`<rect class="m-road" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`);
  (L.diag||[]).forEach(d=>h+=`<line class="m-roadl" x1="${d[0]}" y1="${d[1]}" x2="${d[2]}" y2="${d[3]}" stroke-width="${d[4]}"/>`);
  L.parks.forEach(o=>{h+=`<polygon class="m-park" points="${o.pts}"/>`;o.t.forEach((t,i)=>h+=`<text class="m-park-t" x="${o.cx}" y="${o.cy+(i-(o.t.length-1)/2)*13}">${esc(t)}</text>`);
    if(o.dp)h+=`<rect class="m-dp" x="${o.dp[0]-11}" y="${o.dp[1]-9}" width="22" height="18" rx="2"/><text class="m-dp-t" x="${o.dp[0]}" y="${o.dp[1]}">DP</text>`});
  pr.plots.forEach(p=>{
    const dim=UI.filter!=='all'&&p.status!==UI.filter,sel=UI.sheet&&UI.sheet.id===p.id;
    const fs=Math.max(8,Math.min(16,Math.min(p.w,p.h)*.34)),cx=p.pts?p.x+p.w*.4:p.x+p.w/2,cy=p.y+p.h/2;
    const sh=p.pts?`<polygon class="sh" points="${p.pts}"/>`:`<rect class="sh" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>`;
    h+=`<g class="m-plot st-${p.status}${dim?' dim':''}${sel?' sel':''}" data-act="plot" data-id="${p.id}" data-label="${p.label.toLowerCase()}" tabindex="0" role="button" aria-label="Plot ${p.label}, ${LBL[p.status]}, ${p.sqft} square feet">${sh}<text x="${cx}" y="${cy}" font-size="${fs}">${p.label}</text></g>`});
  L.labels.forEach(l=>h+=`<text class="m-lbl" x="${l.x}" y="${l.y}"${l.r?` transform="rotate(${l.r} ${l.x} ${l.y})"`:''}>${l.t}</text>`);
  const [cx,cy]=L.compass;h+=`<g class="m-comp" transform="translate(${cx} ${cy})"><circle r="20"/><path d="M0,-15 L6,4 L0,0 L-6,4 Z"/><text y="16">N</text></g>`;
  return h+'</svg>';
}

  }
  return `<div class="stack-v"><div><button class="back" data-act="nav" data-v="projects">← All projects</button>

function sheetPlot(){
  const [pr,p]=findPlot(UI.sheet.id);if(!p)return'';
  const v=val(pr,p),g=p.sqft*pr.guideline,vs=vastu(p),m=UI.sheet.mode,role=me().role,b=bal(pr,p),sell=canSell();
  const team=S.users.map(u=>`<option value="${u.id}"${u.id===UI.user?' selected':''}>${u.id==='own'?'Owner (direct)':esc(u.name)}</option>`).join('');
  const bySel=role==='broker'?`<input type="hidden" name="by" value="${UI.user}">`:`<label>Sold by<select id="p-by" name="by">${team}</select></label>`;
  let form='';
  if(m==='book')form=`<form class="f" data-form="book"><h3>Book ${p.label}</h3><label>Customer name<input id="p-n" name="buyer" required></label><label>Mobile (WhatsApp)<input id="p-ph" name="phone" type="tel" required placeholder="+91"></label><label>Advance received (₹)<input id="p-adv" name="advance" type="number" min="0" required value="${r10k(v*.1)}"></label><label>Balance due by<input id="p-due" name="due" type="date" required value="${dayOff(30)}"></label><label>Registration date (optional)<input id="p-reg" name="reg" type="date"></label>${bySel}<div class="wide btns"><button class="btn pri" type="submit">Confirm booking</button><button class="btn" type="button" data-act="mode" data-v="">Cancel</button></div></form>`;
  if(m==='sell')form=`<form class="f" data-form="sell"><h3>Mark ${p.label} as sold</h3>${p.status==='available'?`<label>Customer name<input id="s-n" name="buyer" required></label><label>Mobile (WhatsApp)<input id="s-ph" name="phone" type="tel" required placeholder="+91"></label>${bySel}`:''}<label>Amount received now (₹)<input id="s-amt" name="amount" type="number" min="0" value="${p.status==='available'?Math.round(v):Math.round(b)}"></label><label>Registration date<input id="s-reg" name="reg" type="date" value="${p.regDate||dayOff(7)}" required></label><div class="wide btns"><button class="btn pri" type="submit">Mark sold</button><button class="btn" type="button" data-act="mode" data-v="">Cancel</button></div></form>`;
  if(m==='pay')form=`<form class="f" data-form="pay"><h3>Record customer payment</h3><label>Amount (₹)<input id="y-amt" name="amount" type="number" min="1" max="${Math.round(b)}" value="${Math.round(b)}" required></label><label>Next due date<input id="y-due" name="due" type="date" value="${p.dueDate||''}"></label><div class="wide btns"><button class="btn pri" type="submit">Save payment</button><button class="btn" type="button" data-act="mode" data-v="">Cancel</button></div></form>`;
  if(m==='reg')form=`<form class="f" data-form="reg"><h3>Registration date</h3><label class="wide">Date at Sub-Registrar office<input id="r-d" name="reg" type="date" value="${p.regDate||dayOff(7)}" required></label><div class="wide btns"><button class="btn pri" type="submit">Save and notify</button><button class="btn" type="button" data-act="mode" data-v="">Cancel</button></div></form>`;
  if(m==='rate')form=`<form class="f" data-form="prate"><h3>Price for ${p.label}</h3><label class="wide">Sale rate (₹/ft²). Leave empty to use the project rate of ₹${pr.rate}.<input id="pr-r" name="rate" type="number" min="0" step="10" value="${p.rate||''}"></label><div class="wide btns"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" data-act="mode" data-v="">Cancel</button></div></form>`;
  const acts=[];
  if(p.status==='available'){acts.push(['book','Book plot','pri']);if(sell)acts.push(['sell','Mark sold',''])}
  if(p.status==='booked'&&sell){acts.push(['pay','Record payment','pri'],['sell','Mark sold',''],['reg',p.regDate?'Change registration date':'Set registration date',''])}
  if(p.status==='sold'&&sell){if(b>0)acts.push(['pay','Record payment','pri']);if(!p.registered)acts.push(['reg',p.regDate?'Change registration date':'Set registration date',''])}
  if(sell&&p.status==='available')acts.push(['rate','Change plot price','ghost']);
  return `<div class="sh-h"><div class="t"><span class="lbl">${esc(pr.name)}</span><h2>Plot ${p.label}</h2><span class="pill st-${p.status}">${LBL[p.status]}${p.status==='sold'&&p.registered?' · registered':''}</span></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="dl">
    <div><span class="lbl">Size</span><b>${p.front} × ${p.depth} ft</b></div><div><span class="lbl">Area</span><b>${p.sqft.toLocaleString('en-IN')} ft²</b></div>
    <div><span class="lbl">In cents</span><b>${(p.sqft/435.6).toFixed(2)} cents</b></div><div><span class="lbl">In sq m</span><b>${(p.sqft*.092903).toFixed(1)} m²</b></div>
    <div><span class="lbl">Facing</span><b>${p.facing.map(f=>DIR[f]).join(' + ')}${p.facing.length>1?' (corner)':''}</b></div><div><span class="lbl">Sale rate</span><b>₹${(p.rate||pr.rate).toLocaleString('en-IN')}/ft²${p.rate?' *':''}</b></div>
    <div><span class="lbl">Sale value</span><b>${inr(v)}</b></div><div><span class="lbl">Guideline value</span><b>${inr(g)}</b></div>
  </div>
  <section class="sec"><div class="card-h" style="margin:0"><h3>Vastu</h3><span class="stars" aria-label="${vs.score} out of 5">${stars(vs.score)}</span></div>
    <div class="vastu">${vs.notes.map(([t,d,k])=>`<div class="vrow"><i class="${k}"></i><div><b>${t}</b><small>${d}</small></div></div>`).join('')}</div>
    <p class="hint">Based on common vastu guidance for plot facing, corner and shape.</p></section>
  ${p.status!=='available'?`<section class="sec"><h3>Customer & payment</h3><div class="dl">
    <div><span class="lbl">Customer</span><b>${esc(p.buyer)}</b></div><div><span class="lbl">Mobile</span><b>${esc(p.phone)}</b></div>
    <div><span class="lbl">Paid</span><b>${inr(p.paid)}</b></div><div><span class="lbl">Balance</span><b class="${b>0?'neg':'pos'}">${inr(b)}</b></div>
    <div><span class="lbl">Balance due</span><b>${b>0&&p.dueDate?fmtD(p.dueDate):'—'}</b></div><div><span class="lbl">Registration</span><b>${p.regDate?fmtD(p.regDate):'Not set'}</b></div>
    <div class="wide"><span class="lbl">Handled by</span><b>${esc(uname(p.soldBy))}</b></div></div></section>`:''}
  ${form||(acts.length?`<div class="btns">${acts.map(([k,l,c])=>`<button class="btn ${c}" data-act="mode" data-v="${k}">${l}</button>`).join('')}
    ${p.status==='sold'&&!p.registered&&p.regDate&&sell?`<button class="btn" data-act="registered">Registration done</button>`:''}
    ${p.status==='booked'&&isOwner()?`<button class="btn ghost danger" data-act="release">Cancel booking</button>`:''}</div>`:'<p class="muted">You can view this plot. The owner or sales team can change it.</p>')}
  ${p.history.length?`<section class="sec"><h3>History</h3><div class="list">${p.history.slice(0,8).map(([d,t,u])=>`<div class="li"><div class="body"><p>${esc(t)}</p><span class="meta">${esc(uname(u))} · ${fmtD(d)}</span></div></div>`).join('')}</div></section>`:''}`;
}

const app=document.getElementById('app'),sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
function render(){
  const w=document.getElementById('mapwrap'),sl=w&&[w.scrollLeft,w.scrollTop];
  app.innerHTML=shell();
  const w2=document.getElementById('mapwrap');if(w2&&sl){w2.scrollLeft=sl[0];w2.scrollTop=sl[1]}
  if(UI.sheet){sheet.innerHTML=UI.sheet.type==='plot'?sheetPlot():sheetNotes();sheet.hidden=false;scrim.hidden=false}else{sheet.hidden=true;scrim.hidden=true}
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
function commit(msg){if(UI.sheet)UI.sheet.mode=null;save();render();if(msg)toast(msg)}

/* ---------- actions ---------- */
const ACT={
  nav:d=>{UI.view=d.v;UI.proj=null;UI.sheet=null;render();scrollTo(0,0)},
  open:d=>{UI.view='project';UI.proj=d.id;UI.ptab='layout';UI.filter='all';render();scrollTo(0,0)},
  ptab:d=>{UI.ptab=d.v;render()},
  filter:d=>{UI.filter=d.v;render()},
  zoom:d=>{const v=+d.v;UI.zoom=v===0?1:Math.max(1,Math.min(5,UI.zoom+(v*.6)));const s=document.getElementById('map');if(s)s.style.width=UI.zoom*100+'%'},
  plot:d=>{UI.sheet={type:'plot',id:d.id,mode:null};render();sheet.scrollTop=0;sheet.querySelector('.x')?.focus()},
  bell:()=>{UI.sheet={type:'notes'};render()},
  close:()=>{UI.sheet=null;render()},
  mode:d=>{UI.sheet.mode=d.v||null;render();if(d.v)sheet.querySelector('form input:not([type=hidden])')?.focus()},
  registered:()=>{const[pr,p]=findPlot(UI.sheet.id);p.registered=true;if(p.regDate&&daysTo(p.regDate)>0)p.regDate=TODAY;log(p,'Registration completed');notify(`${me().name==='You'?'Owner':me().name} completed registration of ${p.label} · ${pr.name} for ${p.buyer}`,'sold');commit('Registration marked complete')},
  release:()=>{const[pr,p]=findPlot(UI.sheet.id);const who=p.buyer;Object.assign(p,{status:'available',buyer:null,phone:null,paid:0,dueDate:null,regDate:null,registered:false,soldBy:null});log(p,`Booking by ${who} cancelled`);notify(`Owner cancelled the booking of ${p.label} · ${pr.name}. Plot is available again.`,'available');commit('Booking cancelled. Plot is available again.')},
  remind:d=>{const r=reminders().find(x=>x.key===d.key);if(r){dispatch(r,UI.user);commit('Reminder sent to team and customer')}},
  copy:(d,el)=>{const done=()=>toast('Message copied');try{navigator.clipboard.writeText(d.text).then(done,()=>toast('Copy blocked. Select the message text instead.'))}catch(e){toast('Copy blocked. Select the message text instead.')}},
  finproj:d=>{UI.finProj=d.v;UI.finPay=null;UI.addCost=false;UI.editFund=false;render()},
  finpay:d=>{UI.finPay=d.id||null;render()},
  addcost:()=>{UI.addCost=!UI.addCost;render()},
  editfund:()=>{UI.editFund=!UI.editFund;render()},
  teamopen:(d,el,e)=>{if(e.target.closest('button,form'))return;UI.teamOpen=UI.teamOpen===d.id?null:d.id;render()},
  teampay:d=>{UI.teamPay=d.id||null;render()},
  addmember:()=>{UI.addMember=!UI.addMember;render()},
  reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();autoDispatch();UI.sheet=null;UI.view='home';save();render();toast('Sample data restored')}
};
const actorName=()=>UI.user==='own'?'Owner':me().name;
const FORMS={
  book:d=>{const[pr,p]=findPlot(UI.sheet.id);Object.assign(p,{status:'booked',buyer:d.buyer.trim(),phone:d.phone.trim(),paid:+d.advance||0,dueDate:d.due||null,regDate:d.reg||null,registered:false,soldBy:d.by||UI.user});
    log(p,`Booked for ${p.buyer}, advance ${inr(p.paid)}`);notify(`${actorName()} booked ${p.label} · ${pr.name} for ${p.buyer} (advance ${inr(p.paid)})`,'booked');
    custMsg(pr,p,'booked',`Dear ${p.buyer}, thank you for booking plot ${p.label} at ${pr.name}. Advance received: ${inr(p.paid)}. Balance ${inr(bal(pr,p))} is due by ${fmtD(p.dueDate)}. – ${S.company}`);
    commit(`${p.label} booked. Team notified, customer messaged.`)},
  sell:d=>{const[pr,p]=findPlot(UI.sheet.id);if(p.status==='available')Object.assign(p,{buyer:d.buyer.trim(),phone:d.phone.trim(),soldBy:d.by||UI.user,paid:0});
    p.status='sold';p.paid=Math.min(val(pr,p),p.paid+(+d.amount||0));p.regDate=d.reg;p.registered=false;
    log(p,`Marked sold, registration ${fmtD(p.regDate)}`);notify(`${actorName()} marked ${p.label} · ${pr.name} as Sold to ${p.buyer}. Registration on ${fmtD(p.regDate)}`,'sold');
    commit(`${p.label} marked sold`)},
  pay:d=>{const[pr,p]=findPlot(UI.sheet.id);const a=+d.amount||0;p.paid=Math.min(val(pr,p),p.paid+a);if(d.due)p.dueDate=d.due;
    log(p,`Payment received ${inr(a)}`);notify(`${actorName()} recorded a payment of ${inr(a)} for ${p.label} · ${pr.name} (balance ${inr(bal(pr,p))})`,'money');commit('Payment saved')},
  reg:d=>{const[pr,p]=findPlot(UI.sheet.id);p.regDate=d.reg;log(p,`Registration set for ${fmtD(p.regDate)}`);notify(`${actorName()} set registration of ${p.label} · ${pr.name} for ${fmtD(p.regDate)}`,'reg');autoDispatch();commit('Registration date saved')},
  prate:d=>{const[pr,p]=findPlot(UI.sheet.id);p.rate=d.rate?+d.rate:null;log(p,p.rate?`Price set to ₹${p.rate}/ft²`:'Price reset to project rate');notify(`${actorName()} changed the price of ${p.label} · ${pr.name} to ₹${(p.rate||pr.rate).toLocaleString('en-IN')}/ft²`,'rate');commit('Plot price saved')},
  rates:d=>{const pr=PR(UI.proj);pr.guideline=+d.guideline;pr.rate=+d.rate;pr.rateBy=UI.user;pr.rateOn=TODAY;notify(`${actorName()} updated ${pr.name} rates: guideline ₹${pr.guideline.toLocaleString('en-IN')}/ft², sale ₹${pr.rate.toLocaleString('en-IN')}/ft²`,'rate');commit('Rates updated for the whole team')},
  fund:d=>{const pr=PR(UI.finProj);pr.funding={bank:+d.bank||0,credit:+d.credit||0,cash:+d.cash||0};UI.editFund=false;commit('Funding saved')},
  cost:d=>{const pr=PR(UI.finProj);pr.costs.push({id:pr.id+'c'+Date.now(),cat:d.cat,party:d.party.trim(),committed:+d.committed||0,paid:Math.min(+d.paid||0,+d.committed||0)});UI.addCost=false;commit('Expense added')},
  costpay:d=>{const pr=PR(UI.finProj),c=pr.costs.find(x=>x.id===UI.finPay);c.paid=Math.min(c.committed,c.paid+(+d.amount||0));UI.finPay=null;commit(`Payment to ${c.party} saved`)},
  commpay:d=>{const u=U(UI.teamPay);S.commPaid.push({uid:u.id,pid:d.pid,amount:+d.amount,date:TODAY});notify(`Owner paid ${inr(+d.amount)} commission to ${u.name} for ${PR(d.pid).name}`,'money',[u.id]);UI.teamPay=null;commit(`Commission paid to ${u.name}`)},
  member:d=>{S.users.push({id:'u'+Date.now(),name:d.name.trim(),phone:d.phone.trim(),role:d.role,rate:+d.rate||0});UI.addMember=false;commit(`${d.name.trim()} added`)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A')return;e.preventDefault();f(t.dataset,t,e)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.sheet){UI.sheet=null;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('m-plot')){e.preventDefault();ACT.plot(e.target.dataset)}
  if(e.key==='Enter'&&e.target.id==='plotq'){const q=e.target.value.trim().toLowerCase();const pr=PR(UI.proj);const p=pr&&pr.plots.find(x=>x.label.toLowerCase()===q);if(p)ACT.plot({id:p.id});else toast('No plot '+e.target.value+' in this project')}
});
document.addEventListener('input',e=>{if(e.target.id!=='plotq')return;const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.m-plot').forEach(g=>g.classList.toggle('hit',!!q&&g.dataset.label===q));
  const hit=q&&document.querySelector(`.m-plot[data-label="${CSS.escape(q)}"]`);if(hit)hit.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})});
document.addEventListener('change',e=>{
  if(e.target.id==='role'){UI.user=e.target.value;UI.sheet=null;if(['finance','team'].includes(UI.view)&&!isOwner())UI.view='home';render();const n=unread();toast(`Now viewing as ${UI.user==='own'?'Owner':me().name}${n?` · ${n} new update${n>1?'s':''}`:''}`)}
  if(e.target.dataset.set){S.settings[e.target.dataset.set]=+e.target.value;autoDispatch();commit('Reminder timing saved')}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();FORMS[f.dataset.form]?.(Object.fromEntries(new FormData(f)))});

S=load()||seed();
autoDispatch();
render();
</script>
